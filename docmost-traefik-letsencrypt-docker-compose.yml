# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}}
  postgres: &postgres-image ${DOCMOST_POSTGRES_IMAGE_TAG:-postgres:${DOCMOST_POSTGRES_IMAGE_VERSION:-16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94}}
  redis: &redis-image ${DOCMOST_REDIS_IMAGE_TAG:-redis:${DOCMOST_REDIS_IMAGE_VERSION:-7.4@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7}}
  docmost: &docmost-image ${DOCMOST_IMAGE_TAG:-docmost/docmost:${DOCMOST_IMAGE_VERSION:-0.95.0@sha256:41c8d777cf23c74e78f94e676aec328b7d7856f48df5e573543dac68d371e37c}}

networks:
  docmost-network:
    external: true
  traefik-network:
    external: true

volumes:
  docmost-data:
  redis-data:
  docmost-postgres:
  docmost-postgres-backup:
  docmost-data-backups:
  docmost-database-backups:
  traefik-certificates:

services:
  postgres:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. DOCMOST_POSTGRES_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    # Docker's default is ten seconds, then SIGKILL. That is not always enough
    # for this image to finish shutting down: PostgreSQL has a checkpoint to
    # write, MariaDB has InnoDB to flush, and Redis saves its dataset on the way
    # out. Killed halfway, the next start does crash recovery, and a Redis that
    # held another application's file locks leaves them behind for a person to
    # clear by hand. Sixty seconds, overridable in .env.
    stop_grace_period: ${DOCMOST_POSTGRES_STOP_GRACE_PERIOD:-60s}
    deploy:
      resources:
        limits:
          memory: ${DOCMOST_POSTGRES_MEMORY_LIMIT:-1g}
          cpus: "${DOCMOST_POSTGRES_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${DOCMOST_POSTGRES_MEMORY_RESERVATION:-128m}
          cpus: "${DOCMOST_POSTGRES_CPU_RESERVATION:-0.25}"
    volumes:
      - docmost-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DOCMOST_DB_NAME:-docmostdb}
      POSTGRES_USER: ${DOCMOST_DB_USER:-docmostdbuser}
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - docmost-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${DOCMOST_DB_NAME:-docmostdb}", "-U", "${DOCMOST_DB_USER:-docmostdbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: *redis-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. DOCMOST_REDIS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    # Docker's default is ten seconds, then SIGKILL. That is not always enough
    # for this image to finish shutting down: PostgreSQL has a checkpoint to
    # write, MariaDB has InnoDB to flush, and Redis saves its dataset on the way
    # out. Killed halfway, the next start does crash recovery, and a Redis that
    # held another application's file locks leaves them behind for a person to
    # clear by hand. Sixty seconds, overridable in .env.
    stop_grace_period: ${DOCMOST_REDIS_STOP_GRACE_PERIOD:-60s}
    deploy:
      resources:
        limits:
          memory: ${DOCMOST_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${DOCMOST_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${DOCMOST_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${DOCMOST_REDIS_CPU_RESERVATION:-0.1}"
    volumes:
      - redis-data:/data
    networks:
      - docmost-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  docmost:
    image: *docmost-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. DOCMOST_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${DOCMOST_MEMORY_LIMIT:-512m}
          cpus: "${DOCMOST_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${DOCMOST_MEMORY_RESERVATION:-64m}
          cpus: "${DOCMOST_CPU_RESERVATION:-0.25}"
    volumes:
      - docmost-data:${DATA_PATH:-/app/data/storage}
    environment:
      APP_URL: ${DOCMOST_URL:?set in .env - see .env.example}
      APP_SECRET: ${DOCMOST_SECRET:?set in .env - see .env.example for generation command}
      DATABASE_URL: postgresql://${DOCMOST_DB_USER:-docmostdbuser}:${DOCMOST_DB_PASSWORD}@postgres:5432/${DOCMOST_DB_NAME:-docmostdb}?schema=public
      REDIS_URL: redis://redis:6379
      # Docmost accepts only smtp or postmark here. With the SMTP variables
      # left empty, the app runs fine and mail sending is simply inert —
      # set the DOCMOST_SMTP_* variables in .env for real delivery.
      MAIL_DRIVER: ${DOCMOST_MAIL_DRIVER:-smtp}
      SMTP_HOST: ${DOCMOST_SMTP_ADDRESS:-}
      SMTP_PORT: ${DOCMOST_SMTP_PORT:-587}
      SMTP_SECURE: ${DOCMOST_SMTP_SECURE:-false}
      SMTP_USERNAME: ${DOCMOST_SMTP_USER_NAME:-}
      SMTP_PASSWORD: ${DOCMOST_SMTP_PASSWORD:-}
      MAIL_FROM_NAME: ${DOCMOST_SMTP_NAME_FROM:-Docmost}
      MAIL_FROM_ADDRESS: ${DOCMOST_EMAIL_FROM:-}
    networks:
      - docmost-network
      - traefik-network
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.docmost.rule=Host(`${DOCMOST_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.docmost.service=docmost"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.docmost.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.docmost.loadbalancer.server.port=3000"
      # Enable TLS on this router
      - "traefik.http.routers.docmost.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.docmost.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.docmost.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.docmost.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. DOCMOST_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${DOCMOST_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${DOCMOST_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${DOCMOST_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${DOCMOST_BACKUPS_CPU_RESERVATION:-0.1}"
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$POSTGRES_BACKUPS_PATH/$$POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres -p 5432 -d $$DOCMOST_DB_NAME -U $$DOCMOST_DB_USER | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        # GNU tar exits 1 when a live application changed a file mid-read;
        # the archive is complete - only exit 2 is a real failure. No GNU-only
        # flags: alpine images ship BusyBox tar.
        tar -zcpf "$$DATA_FILE" $$DATA_PATH; RC=$$?;
        if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$POSTGRES_BACKUPS_PATH" -type f -name "$$POSTGRES_BACKUP_NAME-*" -mtime "+$$POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - docmost-postgres-backup:/var/lib/postgresql/data
      - docmost-data:${DATA_PATH:-/app/data/storage}
      - docmost-data-backups:${DATA_BACKUPS_PATH:-/srv/docmost-application-data/backups}
      - docmost-database-backups:${POSTGRES_BACKUPS_PATH:-/srv/docmost-postgres/backups}
    environment:
      DOCMOST_DB_NAME: ${DOCMOST_DB_NAME:-docmostdb}
      DOCMOST_DB_USER: ${DOCMOST_DB_USER:-docmostdbuser}
      PGPASSWORD: ${DOCMOST_DB_PASSWORD}
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      POSTGRES_BACKUP_PRUNE_DAYS: ${POSTGRES_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      POSTGRES_BACKUPS_PATH: ${POSTGRES_BACKUPS_PATH:-/srv/docmost-postgres/backups}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/docmost-application-data/backups}
      DATA_PATH: ${DATA_PATH:-/app/data/storage}
      POSTGRES_BACKUP_NAME: ${POSTGRES_BACKUP_NAME:-docmost-postgres-backup}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-docmost-application-data-backup}
    networks:
      - docmost-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
